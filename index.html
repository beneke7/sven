<!doctype html>
<html lang="de">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sven Bømwøllen, rebuilt for the browser with the original artwork and campaign.">
  <title>Sven Bømwøllen</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

    <span>↑ ↓ ← → · Leertaste · Esc</span>
